<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>休み確認</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.js"></script>
</head>
<body>
<main>
  <header>
    <h1>処方箋の休み確認</h1>
    <div class="issue">
      <label for="issue-date">交付日</label>
      <span class="picker">
        <span id="issue-display" class="issue-display" aria-hidden="true"></span>
        <input type="date" id="issue-date" required>
      </span>
      <span id="issue-today" class="issue-today">今日</span>
      <button type="button" id="reset-today" hidden>今日に戻す</button>
    </div>
  </header>

  <p id="message" class="message" role="alert" hidden></p>

  <section aria-labelledby="h-expiry">
    <h2 id="h-expiry">使用期限（交付日を含めて 4 日）</h2>
    <ul id="expiry" class="rows"></ul>
  </section>

  <section aria-labelledby="h-offsets">
    <h2 id="h-offsets">交付日 + N 日</h2>
    <ul id="offsets" class="rows"></ul>
  </section>

  <footer>
    <p class="note">参考表示です。最終確認は各自で行ってください。</p>
    <p class="meta">休み = 国民の祝日・振替休日・国民の休日（内閣府）、年末年始（12/29〜1/3）、日曜。土曜・各店の定休日は含みません。<span id="data-range"></span></p>
  </footer>
</main>
<noscript><p class="message">JavaScript を有効にしてください。</p></noscript>
</body>
</html>
